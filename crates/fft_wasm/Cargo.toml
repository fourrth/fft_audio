[package]
name = "fft_wasm"
version = "0.1.0"
edition = "2021"
description = "In-memory browser/WASM bindings for fft_core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Keep the browser build lean: text tables only, no Parquet/Arrow or host UI.
fft_core = { path = "../fft_core", default-features = false, features = ["tables-text"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
