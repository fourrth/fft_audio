[package]
name = "fft_http_adapter"
version = "0.1.0"
edition = "2021"
description = "HTTP/WebSocket adapter that drives an FftApp through a scoped lease"

[lints.cargo]
unused_dependencies = "allow"

[dependencies]
fft_app = { path = "../fft_app" }
fft_core = { path = "../fft_core" }
fft_runtime = { path = "../fft_runtime" }
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "fs",
] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
fft_test = { path = "../fft_test" }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio-tungstenite = "0.26"
tempfile = "3"
