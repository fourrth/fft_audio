[package]
name = "fft_app_host"
version = "0.1.0"
edition = "2021"
description = "Concrete FftApp host, display registry, storage, and lease minting for fft_audio"

[lints.cargo]
unused_dependencies = "allow"

[dependencies]
fft_app = { path = "../fft_app" }
fft_core = { path = "../fft_core" }
fft_runtime = { path = "../fft_runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
