name = "Dark"
appearance = "dark"
plot_palette = [
  "#56b4e9",
  "#e69f00",
  "#009e73",
  "#cc79a7",
  "#f0e442",
  "#0072b2",
  "#d55e00",
  "#e0e0e0",
]

[colors]
bg-canvas = "#0f1217"
bg-panel = "#151921"
bg-card = "#1c222d"
bg-input = "#11151c"
bg-hover = "#242b38"
bg-active = "#2b3444"
border-subtle = "#28303f"
border-strong = "#3c475c"
focus-ring = "#60a5fa"
text-primary = "#e6edf7"
text-secondary = "#9aa7bd"
text-muted = "#7c889e"
text-on-accent = "#09111e"
accent-primary = "#4ea1ff"
kind-spec = "#38bdf8"
kind-order = "#f59e0b"
kind-line = "#34d399"
kind-launcher = "#a78bfa"
kind-settings = "#94a3b8"
font-sans = "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
font-mono = "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
r-sm = "4px"
r-md = "6px"
r-lg = "8px"
shadow-pop = "0 10px 28px rgba(0, 0, 0, 0.45)"
anim-ms = "140ms"
ui-scale = "1"

[status.info]
bg = "rgba(78, 161, 255, 0.14)"
fg = "#7cc0ff"

[status.success]
bg = "rgba(52, 211, 153, 0.15)"
fg = "#34d399"

[status.warn]
bg = "rgba(245, 158, 11, 0.14)"
fg = "#fbbf24"

[status.error]
bg = "rgba(239, 68, 68, 0.15)"
fg = "#f87171"
