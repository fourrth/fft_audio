[package]
name = "fft_python_adapter"
version = "0.1.0"
edition = "2021"
description = "Embedded Python adapter that drives an FftApp through a scoped lease"

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[lints.cargo]
unused_dependencies = "allow"

[dependencies]
fft_app = { path = "../fft_app" }
fft_core = { path = "../fft_core" }
fft_runtime = { path = "../fft_runtime" }
fft_script = { path = "../fft_script" }
serde = { version = "1", features = ["derive"] }
pyo3 = { version = "0.30.1", features = ["auto-initialize", "macros"], optional = true }
numpy = { version = "0.30.0", optional = true }

[dev-dependencies]
fft_app_host = { path = "../fft_app_host" }
fft_test = { path = "../fft_test" }
serde_json = "1"
