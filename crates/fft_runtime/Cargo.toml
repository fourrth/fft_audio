[package]
name = "fft_runtime"
version = "0.1.0"
edition = "2021"
description = "Core-owned data/compute runtime contracts for fft_audio"

[dependencies]
fft_core = { path = "../fft_core" }
serde = { version = "1", features = ["derive"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json = "1"
